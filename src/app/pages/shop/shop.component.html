<section class="shop">
  <h2>Shop Dejen's Merch</h2>
  <p>Exclusive Eritrean-inspired merchandise and music</p>
  <!-- PRODUCTS GRID -->
  <div class="product-grid">
    <div class="product-card" *ngFor="let product of products">
      <img [src]="product.image" [alt]="product.name" />
      <h3>{{ product.name }}</h3>
      <p>${{ product.price }}</p>
      <button (click)="addToCart(product)">
        Add to Cart
      </button>
    </div>
  </div>
</section>
