<div class="account-page">

  <!-- ❌ NOT LOGGED IN -->
  <ng-container *ngIf="!user">

    <div class="auth-wrapper">

      <!-- LEFT: LOGIN -->
      <div class="auth-left">
        <app-login (loggedIn)="reloadAccount()"></app-login>
      </div>

      <!-- DIVIDER -->
      <div class="auth-divider"></div>

      <!-- RIGHT: REGISTER -->
      <div class="auth-right">
        <app-register (registered)="reloadAccount()"></app-register>
      </div>

    </div>

    <!-- RETURN TO STORE -->
    <div class="return-store-wrapper">
      <a routerLink="/shop" class="return-store">
        &lt; Return to Store
      </a>
    </div>

  </ng-container>

  <!-- ✅ LOGGED IN -->
  <ng-container *ngIf="user">

    <!-- 🧾 ORDERS ONLY (CLEAN & FOCUSED) -->
    <h2 class="orders-title">Your Orders</h2>

    <p *ngIf="orders.length === 0" class="no-orders">
      You don’t have any orders yet.
    </p>

    <div *ngFor="let order of orders" class="order-card">

      <!-- HEADER -->
      <div class="order-header">
        <span class="order-number">
          Order #{{ order.id | number:'4.0' }}
        </span>

        <span class="order-date">
          {{ order.created_at | date:'mediumDate' }}
        </span>
      </div>

      <!-- SUMMARY -->
      <div class="order-summary">
        {{ order.items[0]?.name }}
        <span *ngIf="order.items.length > 1">
          + {{ order.items.length - 1 }} more
        </span>
      </div>

      <!-- FOOTER -->
      <div class="order-footer">
        <span class="order-total">
          ${{ order.total_amount }}
        </span>

        <span class="order-status paid">
          Paid
        </span>

        <a
          class="view-details"
          [routerLink]="['/order', order.id]"
        >
          View details →
        </a>
      </div>

    </div>

  </ng-container>

</div>
