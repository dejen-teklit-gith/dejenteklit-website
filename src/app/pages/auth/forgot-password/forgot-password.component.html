<div class="auth-form">
  <h2>Reset your password</h2>

  <div class="field">
    <label>Email</label>
    <input
      type="email"
      [(ngModel)]="email"
      name="email"
      required
    />
  </div>

  <button (click)="submit()" [disabled]="loading">
    {{ loading ? 'Sending…' : 'Send reset link' }}
  </button>

  <p class="success" *ngIf="success">
    {{ success }}
  </p>
</div>
