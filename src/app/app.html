<app-navbar></app-navbar>
<router-outlet></router-outlet>
<app-footer></app-footer>

<!-- OVERLAY -->
<div
  class="overlay"
  *ngIf="cartService.isOpen"
  (click)="cartService.toggleCart()">
</div>

<!-- CART DRAWER -->
<app-cart-drawer></app-cart-drawer>
<!-- TOAST MESSAGE -->
<div class="toast" *ngIf="cartService.toast$ | async">
  Item added to cart ✓
</div>
<!-- CART DRAWER lives globally -->
<app-cart-drawer [checkout]="checkout"></app-cart-drawer>
