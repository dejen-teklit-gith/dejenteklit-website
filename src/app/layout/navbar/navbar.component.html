<nav class="navbar">
  <!-- LEFT -->
  <div class="nav-left">
    <a routerLink="/">HOME</a>
    <a routerLink="/shop">COLLECTIONS</a>
    <a routerLink="/music">MUSIC</a>
  </div>

  <!-- LOGO -->
  <div class="logo">DEJEN</div>

  <!-- RIGHT -->
  <div class="nav-right">

    <!-- 📧 SUBSCRIBE -->
    <lucide-icon
      [img]="Mail"
      (click)="openSubscribe()"
      style="cursor: pointer"
      title="Subscribe"
    ></lucide-icon>

    <!-- 🔍 SEARCH -->
    <lucide-icon
      [img]="Search"
      style="cursor: pointer"
      title="Search"
    ></lucide-icon>

    <!-- 👤 ACCOUNT DRAWER -->
    <lucide-icon
      [img]="User"
      (click)="toggleAccount()"
      style="cursor: pointer"
      [title]="auth.isLoggedIn() ? 'My account' : 'Login / Register'"
    ></lucide-icon>

    <!-- 🛒 CART DRAWER -->
    <div
      class="cart-wrapper"
      (click)="toggleCart()"
      [class.bump]="cartService.animateCart"
    >
      <lucide-icon
        [img]="ShoppingCart"
        title="Cart"
      ></lucide-icon>

      <span class="cart-count" *ngIf="cartService.getCount() > 0">
        {{ cartService.getCount() }}
      </span>
    </div>
  </div>

  <!-- 🍔 HAMBURGER (MOBILE) -->
  <div class="hamburger" (click)="toggleMenu()">
    <lucide-icon *ngIf="!menuOpen" [img]="Menu"></lucide-icon>
    <lucide-icon *ngIf="menuOpen" [img]="X"></lucide-icon>
  </div>
</nav>

<!-- 📱 MOBILE MENU -->
<div class="mobile-menu" *ngIf="menuOpen">
  <a routerLink="/" (click)="toggleMenu()">HOME</a>
  <a routerLink="/shop" (click)="toggleMenu()">COLLECTIONS</a>
  <a routerLink="/music" (click)="toggleMenu()">MUSIC</a>

  <div class="mobile-icons">

    <lucide-icon
      [img]="Mail"
      (click)="openSubscribe(); toggleMenu()"
      title="Subscribe"
    ></lucide-icon>

    <lucide-icon
      [img]="Search"
      title="Search"
    ></lucide-icon>

    <!-- 👤 MOBILE ACCOUNT -->
    <lucide-icon
      [img]="User"
      (click)="toggleAccount(); toggleMenu()"
      title="My account"
      style="cursor: pointer"
    ></lucide-icon>

    <!-- 🛒 MOBILE CART -->
    <div
      class="cart-wrapper"
      (click)="toggleCart(); toggleMenu()"
    >
      <lucide-icon [img]="ShoppingCart"></lucide-icon>

      <span class="cart-count" *ngIf="cartService.getCount() > 0">
        {{ cartService.getCount() }}
      </span>
    </div>
  </div>
</div>
